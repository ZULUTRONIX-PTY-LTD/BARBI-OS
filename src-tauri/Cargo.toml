[package]
name = "barbi"
version = "2.0.0"
description = "B.A.R.B.I — Brilliant Adaptive Reasoning Brain Interface (Personal Intelligent Operating System)"
authors = ["Treasure Trinity Zulu <ZULUTRONIX>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
